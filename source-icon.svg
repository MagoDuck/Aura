<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffea"/>
      <stop offset="100%" style="stop-color:#7a00ff"/>
    </radialGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="512" height="512" rx="100" fill="#000000"/>
  
  <!-- Aura Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#grad)" opacity="0.3"/>
  
  <!-- Anel externo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00ffea" stroke-width="8" opacity="0.8"/>
  
  <!-- Estrela central -->
  <polygon points="256,140 270,210 340,210 285,250 310,320 256,280 202,320 227,250 172,210 242,210" 
           fill="#ffd700" stroke="#ffea00" stroke-width="4"/>
  
  <!-- Texto "A" -->
  <text x="256" y="420" font-size="80" text-anchor="middle" fill="#00ffea" font-weight="bold" font-family="Arial">AURA</text>
  
  <!-- Brilhos -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ffea" stroke-width="2" stroke-dasharray="10 20" opacity="0.5"/>
</svg>